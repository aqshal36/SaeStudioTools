<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Lebihan (Bleed & Layout) – SAE Xpress</title>
<link rel="icon" type="image/png" href="favSae.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css" rel="stylesheet">

<style>
/* ── UI/UX Modern Design Tokens ── */
:root {
  --ink: #1e293b; --paper: #f8fafc; --cream: #ffffff;
  --gold: #d97706; --gold-dim: #fef3c7;
  --blue: #1e3a8a; --blue-light: #2563eb; --blue-dim: #eff6ff;
  --muted: #64748b; --border: #e2e8f0; --border-hover: #cbd5e1;
  --shadow-sm: 0 2px 4px rgba(0, 0, 0, 0.02), 0 4px 6px -1px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 10px 25px -3px rgba(0, 0, 0, 0.08);
  --radius: 20px; --radius-sm: 12px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; }

/* ── Header ── */
.app-header { background: var(--cream); border-bottom: 1px solid var(--border); padding: 16px 24px; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow-sm); }
.header-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
.header-left { display: flex; align-items: center; gap: 16px; }
.header-logo-fallback { width: 44px; height: 44px; background: linear-gradient(135deg, var(--blue), var(--blue-light)); border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 20px; color: white; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2); }
.header-titles { display: flex; flex-direction: column; gap: 2px; }
.header-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); }
.header-title { font-family: 'DM Serif Display', serif; font-size: 1.5rem; line-height: 1; color: var(--ink); }
.header-title em { font-style: italic; color: var(--blue-light); }
.btn-back { display: inline-flex; align-items: center; gap: 8px; padding: 8px 16px; border: 1.5px solid var(--border); border-radius: 100px; background: white; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s ease; }
.btn-back:hover { background: var(--blue-dim); color: var(--blue-light); border-color: var(--blue-light); }

/* ── Main Layout ── */
.app-wrapper { max-width: 1200px; margin: 0 auto; padding: 32px 24px 80px; animation: fadeUp 0.6s cubic-bezier(0.16,1,0.3,1) both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

.main-layout { display: flex; gap: 32px; align-items: flex-start; flex-wrap: wrap; }
.card { background: var(--cream); border-radius: var(--radius); box-shadow: var(--shadow-sm); padding: 32px; border: 1px solid var(--border); }
.controls-card { flex: 1; min-width: 340px; }
.preview-card { flex: 1.5; min-width: 340px; display: flex; flex-direction: column; align-items: center; background: #f1f5f9; }

.section-label { font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
.badge { display: inline-block; background: var(--blue-light); color: white; padding: 4px 10px; border-radius: 100px; font-size: 10px; font-weight: 700; letter-spacing: 0.05em; }
.ctrl-divider { height: 1px; background: var(--border); margin: 28px 0; }
.ctrl-col { display: flex; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.ctrl-col label { font-size: 13px; color: var(--ink); font-weight: 600; }

select, input[type="number"] { font-family: 'Plus Jakarta Sans', sans-serif; font-size: 14px; font-weight: 500; color: var(--ink); background: white; border: 1.5px solid var(--border); border-radius: var(--radius-sm); padding: 12px 16px; outline: none; width: 100%; transition: all 0.2s ease; }
select:focus, input[type="number"]:focus { border-color: var(--blue-light); box-shadow: 0 0 0 3px var(--blue-dim); }

.toggle-group { display: flex; gap: 12px; }
.toggle-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 14px 10px; border: 1.5px solid var(--border); background: white; border-radius: var(--radius-sm); color: var(--muted); font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s ease; line-height: 1.4; }
.toggle-btn span { font-size: 11px; font-weight: 500; opacity: 0.7; margin-top: 2px; }
.toggle-btn.active { border-color: var(--blue-light); background: var(--blue-dim); color: var(--blue-light); box-shadow: 0 2px 8px rgba(37,99,235,0.1); }
.toggle-btn:hover:not(.active) { border-color: var(--border-hover); background: var(--paper); color: var(--ink); }

/* ── Checkbox Khusus ── */
.checkbox-card { display: flex; align-items: center; gap: 10px; background: var(--blue-dim); border: 1px solid var(--blue-light); padding: 14px 16px; border-radius: var(--radius-sm); cursor: pointer; transition: all 0.2s; }
.checkbox-card:hover { background: #e0f2fe; }
.checkbox-card input[type="checkbox"] { width: 18px; height: 18px; cursor: pointer; accent-color: var(--blue-light); margin: 0; }
.checkbox-card span { font-size: 14px; font-weight: 600; color: var(--blue); }

/* ── Custom Size Inputs ── */
.custom-size-row { display: flex; gap: 12px; animation: fadeUp 0.3s ease; }
.custom-size-row .ctrl-col { margin-bottom: 0; flex: 1; }
.custom-size-row label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }

/* ── Upload Area ── */
.upload-box { background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: var(--radius-sm); padding: 32px 16px; text-align: center; cursor: pointer; transition: all 0.2s ease; position: relative; overflow: hidden; }
.upload-box:hover { border-color: var(--blue-light); background: var(--blue-dim); }
.upload-box input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
.upload-box-icon { font-size: 32px; margin-bottom: 12px; display: block; transition: transform 0.2s; }
.upload-box-label { font-size: 15px; font-weight: 700; color: var(--ink); }
.upload-box-sub { font-size: 12px; color: var(--muted); margin-top: 6px; }

/* ── File List (Untuk Crop) ── */
.file-list { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; max-height: 250px; overflow-y: auto; padding-right: 4px; }
.file-item { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: white; border: 1px solid var(--border); border-radius: var(--radius-sm); box-shadow: var(--shadow-sm); }
.file-item-info { display: flex; align-items: center; gap: 10px; overflow: hidden; }
.file-item-thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; background: #eee; border: 1px solid var(--border); }
.file-item-name { font-size: 13px; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 130px; }
.btn-action { background: var(--blue-dim); color: var(--blue-light); border: 1px solid var(--blue-light); padding: 6px 12px; border-radius: 100px; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.2s; display: inline-flex; align-items: center; gap: 4px; }
.btn-action:hover { background: var(--blue-light); color: white; }
.btn-action.del { background: var(--red-dim); color: #dc2626; border-color: #dc2626; padding: 6px 10px; }
.btn-action.del:hover { background: #dc2626; color: white; }

.btn { display: inline-flex; justify-content: center; align-items: center; gap: 8px; padding: 16px 24px; border: none; border-radius: var(--radius-sm); font-family: 'Plus Jakarta Sans', sans-serif; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.2s ease; width: 100%; }
.btn-primary { background: var(--blue-light); color: white; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); margin-top: 16px; }
.btn-primary:hover:not(:disabled) { background: #1d4ed8; box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35); transform: translateY(-2px); }

/* ── Preview ── */
.canvas-wrap { width: 100%; max-width: 320px; aspect-ratio: 32 / 48; background: white; border: 1px solid var(--border); border-radius: 8px; box-shadow: var(--shadow-sm); overflow: hidden; position: relative; transition: all 0.3s ease; }
.canvas-wrap.landscape { aspect-ratio: 48 / 32; max-width: 480px; }
canvas { width: 100%; height: 100%; display: block; }

.pagination { display: flex; gap: 12px; align-items: center; margin-bottom: 24px; width: 100%; justify-content: center; background: white; padding: 12px; border-radius: 100px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); max-width: 300px; }
.btn-page { padding: 8px 16px; border-radius: 100px; border: 1px solid var(--border); background: var(--paper); cursor: pointer; font-size: 13px; font-weight: 700; color: var(--muted); transition: all 0.2s; }
.btn-page:hover { background: var(--blue-light); color: white; border-color: var(--blue-light); }
.page-indicator { font-size: 13px; font-weight: 700; color: var(--ink); min-width: 80px; text-align: center; }

#statsText { background: var(--gold-dim); border: 1px solid #fde68a; border-radius: var(--radius-sm); padding: 16px; font-size: 13px; color: var(--gold); line-height: 1.6; margin-top: 24px; display: none; }
#statsText strong { color: #b45309; }

/* ── Cropper Modal ── */
.modal-overlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px); display: none; align-items: center; justify-content: center; z-index: 999; padding: 20px; opacity: 0; transition: opacity 0.3s; }
.modal-overlay.active { display: flex; opacity: 1; }
.modal-content { background: white; width: 100%; max-width: 800px; border-radius: var(--radius); padding: 24px; box-shadow: var(--shadow-md); display: flex; flex-direction: column; gap: 16px; }
.modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 16px; }
.modal-header h3 { font-size: 18px; color: var(--ink); font-family: 'DM Serif Display', serif;}
.btn-close { background: none; border: none; font-size: 24px; color: var(--muted); cursor: pointer; }
.cropper-wrapper { width: 100%; height: 50vh; min-height: 300px; background: #e2e8f0; border-radius: var(--radius-sm); overflow: hidden; display:flex; align-items:center; justify-content:center;}
.modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 16px; }
</style>
</head>
<body>

  <header class="app-header">
    <div class="header-container">
      <div class="header-left">
        <div class="header-logo-fallback">🗂️</div>
        <div class="header-titles">
          <span class="header-eyebrow">SAE Xpress Bogor</span>
          <h1 class="header-title">Alat <em>Lebihan</em></h1>
        </div>
      </div>
      <div class="header-right"><a href="index.html" class="btn-back">← Kembali</a></div>
    </div>
  </header>

<div class="app-wrapper">
  <div class="main-layout">
    
    <div class="card controls-card">
      <div class="section-label">1. Upload Gambar / PDF <span class="badge">Multi File</span></div>
      <div class="ctrl-col">
        <div class="upload-box" id="uploadBox">
          <span class="upload-box-icon">🖼️</span>
          <div class="upload-box-label" id="uploadLabel">Pilih atau Tarik File Ke Sini</div>
          <div class="upload-box-sub">Support JPG, PNG, dan PDF (Banyak Halaman)</div>
          <input type="file" id="imageInput" accept="image/png,image/jpeg,application/pdf" multiple>
        </div>
        
        <div id="fileList" class="file-list"></div>
      </div>

      <div class="ctrl-divider"></div>
      
      <div class="section-label">2. Konfigurasi Halaman</div>
      
      <div class="ctrl-col">
        <label>Orientasi Kertas A3+</label>
        <div class="toggle-group" id="orientasiToggle">
          <button class="toggle-btn active" data-val="portrait">Portrait<span>32 x 48 cm</span></button>
          <button class="toggle-btn" data-val="landscape">Landscape<span>48 x 32 cm</span></button>
        </div>
      </div>

      <div class="ctrl-col">
        <label>Ukuran Potong Asli</label>
        <select id="sizeSelect">
          <option value="9,5.5">Kartu Nama (9 x 5.5 cm)</option>
          <option value="7.4,10.5">A7 (7.4 x 10.5 cm)</option>
          <option value="10.5,14.8">A6 (10.5 x 14.8 cm)</option>
          <option value="14.8,21">A5 (14.8 x 21 cm)</option>
          <option value="21,29.7">A4 (21 x 29.7 cm)</option>
          <option value="29.7,42">A3 (29.7 x 42 cm)</option>
          <option value="21.6,27.9">Letter (21.6 x 27.9 cm)</option>
          <option value="21.6,35.6">Legal (21.6 x 35.6 cm)</option>
          <option value="custom">📏 Ukuran Custom...</option>
        </select>
      </div>

      <div class="custom-size-row" id="customSizeContainer" style="display: none;">
        <div class="ctrl-col">
          <label>Lebar (cm)</label>
          <input type="number" id="customW" value="10" step="0.1" min="1">
        </div>
        <div class="ctrl-col">
          <label>Tinggi (cm)</label>
          <input type="number" id="customH" value="10" step="0.1" min="1">
        </div>
      </div>
      
      <div class="ctrl-col" style="margin-top: 10px;">
        <label>Jumlah Kopi Per File</label>
        <input type="number" id="copyInput" value="1" min="1">
      </div>

      <div class="ctrl-col" style="margin-top: 10px;">
        <label class="checkbox-card">
          <input type="checkbox" id="bleedCheckbox" checked>
          <span>Beri Lebihan (Bleed 0.4 cm)</span>
        </label>
      </div>

      <div id="statsText" style="display: none;"></div>
      
      <button class="btn btn-primary" id="generatePdfBtn" disabled>💾 Download PDF</button>
    </div>

    <div class="card preview-card">
      <div class="pagination" id="pagination" style="display:none;">
        <button class="btn-page" id="prevPage">◀ Prev</button>
        <div class="page-indicator" id="pageIndicator">Hal 1 / 1</div>
        <button class="btn-page" id="nextPage">Next ▶</button>
      </div>
      
      <div class="canvas-wrap" id="canvasWrapper">
        <canvas id="previewCanvas"></canvas>
      </div>
    </div>
    
  </div>
</div>

<div class="modal-overlay" id="cropModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>✂️ Sesuaikan Area Potong</h3>
      <button class="btn-close" id="closeModalBtn">&times;</button>
    </div>
    <div style="font-size: 13px; color: var(--muted); margin-top: -10px;">
      Kotak biru adalah batas potong asli gambar.
    </div>
    <div class="cropper-wrapper">
      <img id="cropperImage" src="" style="display:block; max-width:100%;">
    </div>
    <div class="modal-actions">
      <button class="btn-page" id="cancelCropBtn" style="border-color:var(--border);">Batal</button>
      <button class="btn-primary" id="saveCropBtn" style="padding:10px 24px; margin-top:0; width:auto;">Terapkan Potongan</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<script>
  // Setup PDF.js Worker
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  let PAGE_W = 32, PAGE_H = 48;
  let PRINT_W = 31.5, PRINT_H = 47.5;
  const PX_PER_CM_PDF = 118; // Resolusi Tinggi ~300 DPI

  // State
  let uploadItems = []; // { id, name, originalImg, cropData }
  let processedItems = []; 
  let layoutPages = [];
  let currentPreviewPage = 0;
  let currentOrientation = 'portrait';
  let cropper = null;
  let currentCropId = null;

  // DOM Elements
  const imageInput = document.getElementById('imageInput');
  const sizeSelect = document.getElementById('sizeSelect');
  const customSizeContainer = document.getElementById('customSizeContainer');
  const customW = document.getElementById('customW');
  const customH = document.getElementById('customH');
  const copyInput = document.getElementById('copyInput');
  const bleedCheckbox = document.getElementById('bleedCheckbox');
  
  const generatePdfBtn = document.getElementById('generatePdfBtn');
  const btnPrev = document.getElementById('prevPage');
  const btnNext = document.getElementById('nextPage');
  const closeModalBtn = document.getElementById('closeModalBtn');
  const cancelCropBtn = document.getElementById('cancelCropBtn');
  const saveCropBtn = document.getElementById('saveCropBtn');

  const previewCanvas = document.getElementById('previewCanvas');
  const canvasWrapper = document.getElementById('canvasWrapper');
  const statsText = document.getElementById('statsText');
  const fileListEl = document.getElementById('fileList');
  const ctx = previewCanvas.getContext('2d');
  
  // Fungsi Helper Mendapatkan Ukuran Asli Target
  function getTargetSize() {
    if (sizeSelect.value === 'custom') {
      const cw = parseFloat(customW.value) || 10;
      const ch = parseFloat(customH.value) || 10;
      return [cw, ch];
    }
    return sizeSelect.value.split(',').map(Number);
  }

  // Helper Mendapatkan Nilai Bleed
  function getBleedVal() {
    return bleedCheckbox.checked ? 0.2 : 0;
  }

  // Toggle Custom Size Input
  sizeSelect.addEventListener('change', (e) => {
    if (e.target.value === 'custom') {
      customSizeContainer.style.display = 'flex';
    } else {
      customSizeContainer.style.display = 'none';
    }
    buildLayout();
  });

  // 1. EVENT LISTENER: Orientasi Kertas
  document.querySelectorAll('.toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.toggle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentOrientation = btn.getAttribute('data-val');
      buildLayout();
    });
  });

  // 2. EVENT LISTENER: Input File
  imageInput.addEventListener('change', async (e) => {
    const files = e.target.files; if (!files.length) return;
    document.getElementById('uploadLabel').textContent = "⏳ Memproses file...";
    
    for (let file of files) {
      if (file.type === 'application/pdf') {
        const arrayBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument(arrayBuffer).promise;
        for (let i = 1; i <= pdf.numPages; i++) {
          const page = await pdf.getPage(i);
          const viewport = page.getViewport({ scale: 3.0 }); 
          const c = document.createElement('canvas'); const x = c.getContext('2d');
          c.width = viewport.width; c.height = viewport.height;
          await page.render({ canvasContext: x, viewport: viewport }).promise;
          
          const img = new Image(); img.src = c.toDataURL('image/jpeg', 1.0);
          await new Promise(r => img.onload = r);
          
          uploadItems.push({ 
            id: Date.now().toString() + Math.random().toString(), 
            name: `${file.name} (Hal ${i})`, 
            originalImg: img, 
            cropData: null 
          });
        }
      } else {
        const r = new FileReader();
        r.onload = async (ev) => {
          const img = new Image(); img.src = ev.target.result;
          await new Promise(res => img.onload = res);
          uploadItems.push({ 
            id: Date.now().toString() + Math.random().toString(), 
            name: file.name, 
            originalImg: img, 
            cropData: null 
          });
          renderFileList(); buildLayout();
        };
        r.readAsDataURL(file);
        continue; 
      }
    }
    
    document.getElementById('uploadLabel').textContent = "Tambah File Lain";
    document.getElementById('uploadBox').classList.add('has-file');
    renderFileList();
    buildLayout();
    imageInput.value = ''; 
  });

  function renderFileList() {
    fileListEl.innerHTML = '';
    uploadItems.forEach(item => {
      const div = document.createElement('div'); div.className = 'file-item';
      
      let thumbSrc = item.originalImg.src;
      if (item.cropData) {
        const tc = document.createElement('canvas');
        tc.width = item.cropData.width; tc.height = item.cropData.height;
        tc.getContext('2d').drawImage(item.originalImg, item.cropData.x, item.cropData.y, item.cropData.width, item.cropData.height, 0, 0, tc.width, tc.height);
        thumbSrc = tc.toDataURL();
      }

      div.innerHTML = `
        <div class="file-item-info">
          <img src="${thumbSrc}" class="file-item-thumb">
          <span class="file-item-name">${item.name}</span>
        </div>
        <div style="display:flex; gap:6px;">
          <button class="btn-action" onclick="openCrop('${item.id}')">✂️ Crop</button>
          <button class="btn-action del" onclick="deleteItem('${item.id}')">×</button>
        </div>
      `;
      fileListEl.appendChild(div);
    });
  }

  // 3. FUNGSI GLOBAL: Hapus & Crop
  window.deleteItem = function(id) {
    uploadItems = uploadItems.filter(i => i.id !== id);
    renderFileList(); 
    buildLayout();
    if(uploadItems.length === 0) {
        document.getElementById('uploadBox').classList.remove('has-file');
        document.getElementById('uploadLabel').textContent = "Pilih atau Tarik File Ke Sini";
    }
  }

  window.openCrop = function(id) {
    const item = uploadItems.find(i => i.id === id);
    if(!item) return;
    currentCropId = id;
    
    const [tw, th] = getTargetSize();
    const targetRatio = tw / th;

    const modal = document.getElementById('cropModal');
    const image = document.getElementById('cropperImage');
    
    if(cropper) { cropper.destroy(); cropper = null; }
    
    image.src = item.originalImg.src; 
    modal.classList.add('active');

    setTimeout(() => {
      cropper = new Cropper(image, {
        aspectRatio: targetRatio,
        viewMode: 1,
        dragMode: 'move',
        autoCropArea: 0.9,
        restore: false,
        guides: true,
        center: true,
        highlight: false,
        cropBoxMovable: true,
        cropBoxResizable: true,
        toggleDragModeOnDblclick: false,
        ready() {
          if(item.cropData) { cropper.setData(item.cropData); }
        }
      });
    }, 150);
  }

  // 4. EVENT LISTENER: Tombol Cropper Modal
  function closeCrop() {
    document.getElementById('cropModal').classList.remove('active');
    if(cropper) { cropper.destroy(); cropper = null; }
  }
  closeModalBtn.addEventListener('click', closeCrop);
  cancelCropBtn.addEventListener('click', closeCrop);

  saveCropBtn.addEventListener('click', () => {
    if(!cropper) return;
    const item = uploadItems.find(i => i.id === currentCropId);
    item.cropData = cropper.getData(true);
    closeCrop();
    renderFileList(); 
    buildLayout(); 
  });

  // 5. EVENT LISTENER: Input Pengaturan
  [copyInput, bleedCheckbox, customW, customH].forEach(el => {
    el.addEventListener('change', buildLayout);
    if(el.tagName === 'INPUT') el.addEventListener('input', buildLayout);
  });

  // 6. EVENT LISTENER: Pagination
  btnPrev.addEventListener('click', () => {
    if (currentPreviewPage > 0) { currentPreviewPage--; drawPreview(); }
  });
  
  btnNext.addEventListener('click', () => {
    if (currentPreviewPage < layoutPages.length - 1) { currentPreviewPage++; drawPreview(); }
  });

  // 7. EVENT LISTENER: Simpan PDF
  generatePdfBtn.addEventListener('click', () => {
    if (layoutPages.length === 0) return;
    generatePdfBtn.disabled = true; 
    generatePdfBtn.textContent = '⏳ Menyusun PDF...';
    
    setTimeout(() => {
      try {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({ unit: 'cm', format: [PAGE_W, PAGE_H], orientation: currentOrientation });
        
        layoutPages.forEach((p, idx) => {
          if (idx > 0) pdf.addPage([PAGE_W, PAGE_H], currentOrientation);
          
          p.items.forEach((cnv, i) => {
            const c = i % p.cols, r = Math.floor(i / p.cols);
            const x = p.sx + c*p.iw, y = p.sy + r*p.ih;
            
            let imgData;
            if (p.itemRotated) {
              const rCnv = document.createElement('canvas'); rCnv.width = cnv.height; rCnv.height = cnv.width;
              const rx = rCnv.getContext('2d');
              rx.translate(rCnv.width/2, rCnv.height/2); rx.rotate(90 * Math.PI / 180);
              rx.drawImage(cnv, -cnv.width/2, -cnv.height/2);
              imgData = rCnv.toDataURL('image/jpeg', 0.95);
            } else {
              imgData = cnv.toDataURL('image/jpeg', 0.95);
            }
            pdf.addImage(imgData, 'JPEG', x, y, p.iw, p.ih);
          });
          
          pdf.setDrawColor(0); pdf.setLineWidth(0.015); const cl = 0.4;
          for(let r=0; r <= p.rows; r++) {
            const y = p.sy + r*p.ih;
            pdf.line(p.sx, y, p.sx - cl, y); pdf.line(p.sx + p.cols*p.iw, y, p.sx + p.cols*p.iw + cl, y);
          }
          for(let c=0; c <= p.cols; c++) {
            const x = p.sx + c*p.iw;
            pdf.line(x, p.sy, x, p.sy - cl); pdf.line(x, p.sy + p.rows*p.ih, x, p.sy + p.rows*p.ih + cl);
          }
        });
        
        pdf.save(`SAE_Lebihan_${layoutPages.length}Lbr.pdf`);
      } catch(err) { alert("Gagal menyimpan PDF: " + err.message); }
      generatePdfBtn.disabled = false; generatePdfBtn.textContent = '💾 Download PDF';
    }, 100);
  });

  // ── CORE LOGIC PEMBUATAN LAYOUT ──
  function buildLayout() {
    if (!uploadItems.length) {
      ctx.clearRect(0,0,previewCanvas.width,previewCanvas.height);
      generatePdfBtn.disabled = true; statsText.style.display = 'none';
      document.getElementById('pagination').style.display = 'none';
      return;
    }
    
    if (currentOrientation === 'landscape') {
      PAGE_W = 48; PAGE_H = 32; PRINT_W = 47.5; PRINT_H = 31.5;
      canvasWrapper.classList.add('landscape');
    } else {
      PAGE_W = 32; PAGE_H = 48; PRINT_W = 31.5; PRINT_H = 47.5;
      canvasWrapper.classList.remove('landscape');
    }

    const [targetW, targetH] = getTargetSize();
    const activeBleed = getBleedVal();
    
    processedItems = uploadItems.map(item => generatePrintCanvas(item, targetW, targetH, activeBleed));
    calculatePages(processedItems, targetW, targetH, activeBleed);
  }

  function generatePrintCanvas(item, wCm, hCm, bleedCm) {
    const w = Math.round(wCm * PX_PER_CM_PDF), h = Math.round(hCm * PX_PER_CM_PDF), b = Math.round(bleedCm * PX_PER_CM_PDF);
    const tw = w + b*2, th = h + b*2;
    const img = item.originalImg;

    const bc = document.createElement('canvas'); bc.width = tw; bc.height = th;
    const bx = bc.getContext('2d');

    if (item.cropData) {
      const cd = item.cropData;
      const scaleX = w / cd.width;
      const scaleY = h / cd.height;
      const bleedPxX = b / scaleX;
      const bleedPxY = b / scaleY;

      const sx = cd.x - bleedPxX;
      const sy = cd.y - bleedPxY;
      const sw = cd.width + (bleedPxX * 2);
      const sh = cd.height + (bleedPxY * 2);

      bx.drawImage(img, sx, sy, sw, sh, 0, 0, tw, th);

      if (sx < 0 || sy < 0 || sx + sw > img.width || sy + sh > img.height) {
         return createMirrorBleedCanvas(img, wCm, hCm, bleedCm, PX_PER_CM_PDF, cd);
      }
    } else {
      return createMirrorBleedCanvas(img, wCm, hCm, bleedCm, PX_PER_CM_PDF, null);
    }
    return bc;
  }

  function createMirrorBleedCanvas(img, wCm, hCm, bleedCm, pxPerCm, cropData) {
    const w = Math.round(wCm * pxPerCm), h = Math.round(hCm * pxPerCm), b = Math.round(bleedCm * pxPerCm);
    const tw = w + b*2, th = h + b*2;

    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const cx = c.getContext('2d');
    
    if (cropData) {
      cx.drawImage(img, cropData.x, cropData.y, cropData.width, cropData.height, 0, 0, w, h);
    } else {
      const ia = img.width / img.height, ta = w / h;
      let sx, sy, sw, sh;
      if (ia > ta) { sh = img.height; sw = img.height * ta; sx = (img.width - sw) / 2; sy = 0; }
      else { sw = img.width; sh = img.width / ta; sx = 0; sy = (img.height - sh) / 2; }
      cx.drawImage(img, sx, sy, sw, sh, 0, 0, w, h);
    }

    const bc = document.createElement('canvas'); bc.width = tw; bc.height = th;
    const bx = bc.getContext('2d');
    bx.drawImage(c, b, b);
    
    if(b > 0) {
      bx.save(); bx.translate(b, 0); bx.scale(-1, 1); bx.drawImage(c, 0, 0, b, h, 0, b, b, h); bx.restore();
      bx.save(); bx.translate(tw-b, 0); bx.scale(-1, 1); bx.drawImage(c, w-b, 0, b, h, -b, b, b, h); bx.restore();
      bx.save(); bx.translate(0, b); bx.scale(1, -1); bx.drawImage(bc, 0, b, tw, b, 0, 0, tw, b); bx.restore();
      bx.save(); bx.translate(0, th-b); bx.scale(1, -1); bx.drawImage(bc, 0, h, tw, b, 0, -b, tw, b); bx.restore();
    }
    return bc;
  }

  function calculatePages(items, targetW, targetH, bleedCm) {
    const iw_norm = targetW + (bleedCm*2), ih_norm = targetH + (bleedCm*2);
    const c_norm = Math.floor(PRINT_W / iw_norm), r_norm = Math.floor(PRINT_H / ih_norm), total_norm = c_norm * r_norm;
    const c_rot = Math.floor(PRINT_W / ih_norm), r_rot = Math.floor(PRINT_H / iw_norm), total_rot = c_rot * r_rot;

    let cols, rows, layoutItemW, layoutItemH, itemRotated;
    if (total_rot > total_norm) {
      cols = c_rot; rows = r_rot; layoutItemW = ih_norm; layoutItemH = iw_norm; itemRotated = true;
    } else {
      cols = c_norm; rows = r_norm; layoutItemW = iw_norm; layoutItemH = ih_norm; itemRotated = false;
    }

    if (cols === 0 || rows === 0) { 
        statsText.style.display = 'block'; statsText.innerHTML = "❌ Ukuran gambar terlalu besar untuk area cetak.";
        generatePdfBtn.disabled = true; return; 
    }

    const gridW = cols * layoutItemW, gridH = rows * layoutItemH;
    const sx = ((PAGE_W - PRINT_W)/2) + ((PRINT_W - gridW)/2);
    const sy = ((PAGE_H - PRINT_H)/2) + ((PRINT_H - gridH)/2);

    const copies = parseInt(copyInput.value) || 1;
    let allItems = [];
    items.forEach(cnv => { for(let k=0; k<copies; k++) allItems.push(cnv); });

    layoutPages = [];
    for (let i = 0; i < allItems.length; i += (cols*rows)) {
      layoutPages.push({ items: allItems.slice(i, i + (cols*rows)), cols, rows, sx, sy, iw: layoutItemW, ih: layoutItemH, itemRotated });
    }
    
    currentPreviewPage = 0;
    drawPreview();
    
    document.getElementById('pagination').style.display = layoutPages.length > 1 ? 'flex' : 'none';
    generatePdfBtn.disabled = false;
    statsText.style.display = 'block';
    statsText.innerHTML = `Susunan: <strong>${itemRotated ? 'Otomatis Diputar 90°' : 'Normal'}</strong> (${cols}x${rows})<br>Total: <strong>${allItems.length} pcs</strong> membutuhkan <strong>${layoutPages.length} Lembar</strong>`;
  }

  function drawPreview() {
    if (!layoutPages.length) return;
    const s = (currentOrientation === 'landscape' ? 480/PAGE_W : 320/PAGE_W);
    previewCanvas.width = PAGE_W * s; previewCanvas.height = PAGE_H * s;
    ctx.fillStyle = 'white'; ctx.fillRect(0,0,previewCanvas.width,previewCanvas.height);
    
    ctx.fillStyle = '#f8fafc'; ctx.fillRect(((PAGE_W-PRINT_W)/2)*s, ((PAGE_H-PRINT_H)/2)*s, PRINT_W*s, PRINT_H*s);

    const p = layoutPages[currentPreviewPage];
    p.items.forEach((cnv, i) => {
      const c = i % p.cols, r = Math.floor(i / p.cols);
      const x = (p.sx + c*p.iw)*s, y = (p.sy + r*p.ih)*s, w = p.iw*s, h = p.ih*s;
      
      ctx.save(); ctx.translate(x + w/2, y + h/2);
      if (p.itemRotated) { ctx.rotate(90 * Math.PI / 180); ctx.drawImage(cnv, -h/2, -w/2, h, w); } 
      else { ctx.drawImage(cnv, -w/2, -h/2, w, h); }
      ctx.restore();
    });

    ctx.strokeStyle = '#000000'; ctx.lineWidth = 1.5; const cl = 0.4 * s; 
    ctx.beginPath();
    for(let r=0; r <= p.rows; r++) {
      const y = (p.sy + r*p.ih) * s;
      ctx.moveTo(p.sx * s, y); ctx.lineTo((p.sx * s) - cl, y);
      ctx.moveTo((p.sx + p.cols*p.iw) * s, y); ctx.lineTo((p.sx + p.cols*p.iw) * s + cl, y);
    }
    for(let c=0; c <= p.cols; c++) {
      const x = (p.sx + c*p.iw) * s;
      ctx.moveTo(x, p.sy * s); ctx.lineTo(x, (p.sy * s) - cl);
      ctx.moveTo(x, (p.sy + p.rows*p.ih) * s); ctx.lineTo(x, (p.sy + p.rows*p.ih) * s + cl);
    }
    ctx.stroke();

    document.getElementById('pageIndicator').textContent = `Hal ${currentPreviewPage+1} / ${layoutPages.length}`;
  }
</script>
