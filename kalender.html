<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Template Kalender – SAE Xpress</title>
<link rel="icon" type="image/png" href="favSae.png">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#2596be; --primary-dark:#1a7a9e; --primary-light:#e8f5fb;
  --white:#fff; --off:#f7fafc; --gray-100:#e1eaef; --gray-400:#8aabbf;
  --gray-600:#4a7088; --ink:#0d2230;
  --shadow-sm:0 1px 4px rgba(37,150,190,.1);
  --shadow-md:0 4px 20px rgba(37,150,190,.14);
  --shadow-lg:0 12px 40px rgba(37,150,190,.2),0 4px 16px rgba(0,0,0,.08);
  --radius:14px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'DM Sans',sans-serif;background:var(--off);color:var(--ink);min-height:100vh;}

/* Header */
.hdr{background:var(--primary);padding:0 28px;height:64px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(37,150,190,.35);}
.hdr-brand{display:flex;align-items:center;gap:12px;color:#fff;text-decoration:none;}
.hdr-logo{width:38px;height:38px;background:rgba(255,255,255,.2);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid rgba(255,255,255,.3);}
.hdr-title{font-family:'DM Serif Display',serif;font-size:18px;}
.hdr-title em{color:rgba(255,255,255,.8);}
.hdr-back{padding:7px 14px;border:1px solid rgba(255,255,255,.3);border-radius:100px;background:rgba(255,255,255,.12);color:#fff;font-size:12px;font-weight:600;text-decoration:none;}
.hdr-back:hover{background:rgba(255,255,255,.22);}

/* Hero */
.hero{padding:48px 24px 32px;text-align:center;max-width:900px;margin:0 auto;}
.hero h1{font-family:'DM Serif Display',serif;font-size:clamp(28px,4vw,42px);line-height:1.1;letter-spacing:-.5px;margin-bottom:12px;}
.hero h1 em{color:var(--primary);font-style:italic;}
.hero p{color:var(--gray-600);font-size:15px;max-width:480px;margin:0 auto;}

/* Search + Filter */
.toolbar{max-width:1200px;margin:0 auto;padding:0 24px 20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;}
.search{flex:1;min-width:240px;position:relative;}
.search input{width:100%;font-family:inherit;font-size:14px;padding:12px 16px 12px 42px;border:1.5px solid var(--gray-100);border-radius:100px;background:var(--white);outline:none;transition:border-color .2s,box-shadow .2s;}
.search input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(37,150,190,.12);}
.search::before{content:'🔍';position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:14px;opacity:.5;}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{padding:8px 16px;border:1.5px solid var(--gray-100);border-radius:100px;background:var(--white);color:var(--gray-600);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;}
.chip:hover{border-color:var(--primary);color:var(--primary);}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff;}

/* Grid */
.grid{max-width:1200px;margin:0 auto;padding:0 24px 80px;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px;}

/* Card */
.card{background:var(--white);border:1.5px solid var(--gray-100);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .28s cubic-bezier(.34,1.56,.64,1),box-shadow .28s,border-color .28s;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;}
.card:hover{transform:translateY(-5px);border-color:var(--primary);box-shadow:var(--shadow-lg);}
.card-thumb{aspect-ratio:2/3;background:linear-gradient(135deg,#f0f4f7,#e1eaef);position:relative;overflow:hidden;}
.card-thumb img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease;}
.card:hover .card-thumb img{transform:scale(1.04);}
.card-badge{position:absolute;top:10px;right:10px;background:rgba(37,150,190,.92);color:#fff;font-size:10px;font-weight:700;letter-spacing:.5px;padding:4px 10px;border-radius:100px;text-transform:uppercase;}
.card-body{padding:14px 16px 16px;}
.card-title{font-family:'DM Serif Display',serif;font-size:17px;color:var(--ink);margin-bottom:6px;line-height:1.25;}
.card-meta{font-size:12px;color:var(--gray-600);display:flex;gap:10px;margin-bottom:12px;}
.card-meta span{display:flex;align-items:center;gap:4px;}
.card-btn{width:100%;padding:9px 14px;background:var(--primary-light);color:var(--primary);border:1.5px solid rgba(37,150,190,.25);border-radius:8px;font-family:inherit;font-size:12.5px;font-weight:700;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:6px;}
.card-btn:hover{background:var(--primary);color:#fff;border-color:var(--primary);}

/* Skeleton */
.skel{background:linear-gradient(90deg,#eef2f5 0%,#f7fafc 50%,#eef2f5 100%);background-size:200% 100%;animation:skel 1.4s infinite;border-radius:var(--radius);aspect-ratio:2/3;}
@keyframes skel{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

/* Empty state */
.empty{grid-column:1/-1;text-align:center;padding:64px 20px;color:var(--gray-400);}
.empty-icon{font-size:48px;opacity:.5;margin-bottom:12px;}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(13,34,48,.85);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:999;padding:20px;animation:fade .2s;}
.modal.active{display:flex;}
@keyframes fade{from{opacity:0;}to{opacity:1;}}
.modal-box{background:#fff;border-radius:18px;max-width:960px;width:100%;max-height:90vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.4);animation:pop .3s cubic-bezier(.34,1.56,.64,1);}
@keyframes pop{from{opacity:0;transform:scale(.95) translateY(10px);}to{opacity:1;transform:scale(1) translateY(0);}}
.modal-body{display:flex;flex-wrap:wrap;overflow:hidden;}
.modal-img-wrap{flex:1.3;min-width:300px;background:#f0f4f7;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto;max-height:80vh;}
.modal-img-wrap img{max-width:100%;max-height:70vh;border-radius:8px;box-shadow:var(--shadow-md);}
.modal-info{flex:1;min-width:280px;padding:28px 28px 24px;display:flex;flex-direction:column;gap:16px;}
.modal-info h2{font-family:'DM Serif Display',serif;font-size:24px;line-height:1.2;padding-right:30px;}
.modal-tags{display:flex;flex-wrap:wrap;gap:6px;}
.modal-tag{background:var(--primary-light);color:var(--primary);font-size:11px;font-weight:700;padding:4px 10px;border-radius:100px;}
.modal-specs{display:flex;flex-direction:column;gap:10px;font-size:13.5px;color:var(--gray-600);border-top:1px solid var(--gray-100);border-bottom:1px solid var(--gray-100);padding:16px 0;margin:4px 0;}
.modal-specs div{display:flex;gap:10px;align-items:center;}
.modal-specs strong{color:var(--ink);font-weight:600;min-width:80px;}
.modal-close{position:absolute;top:14px;right:14px;background:rgba(255,255,255,.9);border:none;width:32px;height:32px;border-radius:50%;font-size:16px;cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center;transition:background .2s;z-index:2;}
.modal-close:hover{background:#fff;}
.modal-actions{display:flex;gap:10px;margin-top:auto;}
.btn-dl{flex:1;padding:14px 20px;background:var(--primary);color:#fff;border:none;border-radius:10px;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .2s,transform .2s;box-shadow:0 4px 14px rgba(37,150,190,.3);}
.btn-dl:hover{background:var(--primary-dark);transform:translateY(-2px);}
.btn-dl:disabled{opacity:.7;cursor:wait;transform:none;}
.btn-copy{padding:14px 16px;background:var(--off);border:1.5px solid var(--gray-100);border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--gray-600);transition:all .2s;}
.btn-copy:hover{border-color:var(--primary);color:var(--primary);}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--ink);color:#fff;padding:12px 22px;border-radius:100px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);opacity:0;transition:transform .3s,opacity .3s;z-index:9999;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}

@media (max-width:640px){
  .hdr{padding:0 16px;}
  .grid{padding:0 16px 60px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;}
  .modal-body{flex-direction:column;}
  .modal-img-wrap{max-height:40vh;}
  .modal-info{padding:20px;}
}
</style>
</head>
<body>

<header class="hdr">
  <a href="index.html" class="hdr-brand">
    <div class="hdr-logo">📅</div>
    <div class="hdr-title">Template <em>Kalender</em></div>
  </a>
  <a href="index.html" class="hdr-back">← Beranda</a>
</header>

<section class="hero">
  <h1>Pilih Template <em>Kalender</em></h1>
  <p>Klik template untuk melihat preview, lalu unduh file CDR siap edit di CorelDRAW.</p>
</section>

<div class="toolbar">
  <div class="search">
    <input type="text" id="searchInput" placeholder="Cari template... (nama, tag, tahun)">
  </div>
  <div class="chips" id="chips"></div>
</div>

<div class="grid" id="grid">
  <!-- skeleton placeholders -->
  <div class="skel"></div><div class="skel"></div><div class="skel"></div><div class="skel"></div>
</div>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-box" style="position:relative;">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-body">
      <div class="modal-img-wrap">
        <img id="modalImg" src="" alt="">
      </div>
      <div class="modal-info">
        <h2 id="modalTitle">—</h2>
        <div class="modal-tags" id="modalTags"></div>
        <div class="modal-specs" id="modalSpecs"></div>
        <div class="modal-actions">
          <button class="btn-dl" id="modalDownload">⬇ Download CDR</button>
          <button class="btn-copy" id="modalCopy" title="Copy link">🔗</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  /* ── Konfigurasi ──
     Kalau CDR disimpan di GitHub repo:
       const TEMPLATE_BASE = 'templates/';
     Kalau di Cloudflare R2 / CDN:
       const TEMPLATE_BASE = 'https://pub-xxxxx.r2.dev/';
     Preview & JSON tetap di repo. */
  const TEMPLATE_BASE = 'templates/';
  const JSON_URL      = 'templates/index.json';

  const grid      = document.getElementById('grid');
  const searchIn  = document.getElementById('searchInput');
  const chipsEl   = document.getElementById('chips');
  const modal     = document.getElementById('modal');
  const modalImg  = document.getElementById('modalImg');
  const modalTitle= document.getElementById('modalTitle');
  const modalTags = document.getElementById('modalTags');
  const modalSpecs= document.getElementById('modalSpecs');
  const modalDl   = document.getElementById('modalDownload');
  const modalCopy = document.getElementById('modalCopy');
  const modalClose= document.getElementById('modalClose');
  const toastEl   = document.getElementById('toast');

  let allTemplates = [];
  let activeFilter = 'all';
  let currentTemplate = null;

  /* ── Utility ── */
  function toast(msg, dur = 2200){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove('show'), dur);
  }

  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g, c => (
      {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]
    ));
  }

  /* ── Load data ── */
  async function loadTemplates(){
    try {
      const res = await fetch(JSON_URL, { cache: 'no-cache' });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      allTemplates = data.templates || [];
      buildChips();
      render();
    } catch (err) {
      console.error(err);
      grid.innerHTML = `<div class="empty">
        <div class="empty-icon">⚠️</div>
        <div>Gagal memuat daftar template.<br><small>${escapeHTML(err.message)}</small></div>
      </div>`;
    }
  }

  /* ── Chips filter ── */
  function buildChips(){
    const years = [...new Set(allTemplates.map(t => t.year).filter(Boolean))].sort((a,b)=>b-a);
    const cats  = [...new Set(allTemplates.map(t => t.category).filter(Boolean))];

    const items = [
      { val:'all', label:'Semua' },
      ...years.map(y => ({ val:'y:'+y, label:String(y) })),
      ...cats.map(c => ({ val:'c:'+c, label:c.charAt(0).toUpperCase()+c.slice(1) }))
    ];

    chipsEl.innerHTML = items.map(it =>
      `<button class="chip${it.val==='all'?' active':''}" data-val="${escapeHTML(it.val)}">${escapeHTML(it.label)}</button>`
    ).join('');

    chipsEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.chip');
      if (!btn) return;
      chipsEl.querySelectorAll('.chip').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeFilter = btn.dataset.val;
      render();
    });
  }

  /* ── Filter logika ── */
  function applyFilter(list){
    const q = searchIn.value.trim().toLowerCase();
    return list.filter(t => {
      if (activeFilter.startsWith('y:')) {
        if (String(t.year) !== activeFilter.slice(2)) return false;
      } else if (activeFilter.startsWith('c:')) {
        if (t.category !== activeFilter.slice(2)) return false;
      }
      if (!q) return true;
      const hay = [t.name, t.category, t.year, ...(t.tags||[])].join(' ').toLowerCase();
      return hay.includes(q);
    });
  }

  /* ── Render grid ── */
  function render(){
    const list = applyFilter(allTemplates);

    if (!list.length){
      grid.innerHTML = `<div class="empty">
        <div class="empty-icon">🔍</div>
        <div>Tidak ada template yang cocok.</div>
      </div>`;
      return;
    }

    grid.innerHTML = list.map(t => `
      <div class="card" data-id="${escapeHTML(t.id)}">
        <div class="card-thumb">
          <img src="${TEMPLATE_BASE}${escapeHTML(t.folder)}/thumb.webp"
               alt="${escapeHTML(t.name)}"
               loading="lazy"
               onerror="this.style.background='#e1eaef';this.src='';">
          ${t.year ? `<div class="card-badge">${escapeHTML(t.year)}</div>` : ''}
        </div>
        <div class="card-body">
          <div class="card-title">${escapeHTML(t.name)}</div>
          <div class="card-meta">
            <span>📐 ${escapeHTML(t.size||'-')}</span>
            <span>💾 ${escapeHTML(t.cdrSize||'-')}</span>
          </div>
          <button class="card-btn" data-id="${escapeHTML(t.id)}">👁 Lihat & Download</button>
        </div>
      </div>
    `).join('');
  }

  /* ── Event: klik card ── */
  grid.addEventListener('click', (e) => {
    const el = e.target.closest('.card');
    if (!el) return;
    openModal(el.dataset.id);
  });

  /* ── Modal ── */
  function openModal(id){
    const t = allTemplates.find(x => x.id === id);
    if (!t) return;
    currentTemplate = t;

    modalImg.src = `${TEMPLATE_BASE}${t.folder}/preview.webp`;
    modalImg.alt = t.name;
    modalTitle.textContent = t.name;

    modalTags.innerHTML = (t.tags||[]).map(tag =>
      `<span class="modal-tag">${escapeHTML(tag)}</span>`
    ).join('');

    modalSpecs.innerHTML = `
      <div><strong>Ukuran</strong><span>${escapeHTML(t.size||'-')}</span></div>
      <div><strong>Format</strong><span>CorelDRAW (.cdr)</span></div>
      <div><strong>File size</strong><span>${escapeHTML(t.cdrSize||'-')}</span></div>
      ${t.year ? `<div><strong>Tahun</strong><span>${escapeHTML(t.year)}</span></div>` : ''}
    `;

    modal.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeModal(){
    modal.classList.remove('active');
    document.body.style.overflow = '';
    setTimeout(() => { modalImg.src = ''; }, 200);
  }

  modalClose.addEventListener('click', closeModal);
  modal.addEventListener('click', (e) => {
    if (e.target === modal) closeModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modal.classList.contains('active')) closeModal();
  });

  /* ── Download CDR ── */
  modalDl.addEventListener('click', async () => {
    if (!currentTemplate) return;

    // dukung dua format: cdrUrl penuh (CDN) ATAU folder (GitHub repo)
    const url = currentTemplate.cdrUrl
      || `${TEMPLATE_BASE}${currentTemplate.folder}/file.cdr`;

    const filename = `${currentTemplate.id}.cdr`;

    modalDl.disabled = true;
    const oldText = modalDl.innerHTML;
    modalDl.innerHTML = '⏳ Menyiapkan...';

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('HTTP ' + res.status);

      const total = +res.headers.get('content-length') || 0;
      const reader = res.body.getReader();
      const chunks = [];
      let received = 0;

      while (true){
        const { done, value } = await reader.read();
        if (done) break;
        chunks.push(value);
        received += value.length;
        if (total){
          const pct = Math.round(received / total * 100);
          modalDl.innerHTML = `⏳ ${pct}%`;
        }
      }

      const blob = new Blob(chunks, { type: 'application/octet-stream' });
      const objUrl = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = objUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(objUrl), 2000);

      toast('✅ Download dimulai');
    } catch (err) {
      console.error(err);
      toast('❌ Gagal download: ' + err.message, 3500);
    } finally {
      modalDl.disabled = false;
      modalDl.innerHTML = oldText;
    }
  });

  /* ── Copy link ── */
  modalCopy.addEventListener('click', async () => {
    if (!currentTemplate) return;
    const url = location.origin + location.pathname + '?t=' + encodeURIComponent(currentTemplate.id);
    try {
      await navigator.clipboard.writeText(url);
      toast('🔗 Link disalin');
    } catch {
      toast('Gagal menyalin link');
    }
  });

  /* ── Deep link ?t=id ── */
  function checkDeepLink(){
    const params = new URLSearchParams(location.search);
    const id = params.get('t');
    if (id && allTemplates.some(t => t.id === id)) openModal(id);
  }

  /* ── Search ── */
  let searchTimer;
  searchIn.addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(render, 120);
  });

  /* ── Init ── */
  loadTemplates().then(checkDeepLink);

})();
</script>
</body>
</html>
